
<!DOCTYPE html>
<html>
<head>
    <title>Basic Selectors</title>
    <style>
        /* Element Selector */
        h1 {
            color: blue;
        }

        /* ID Selector */
        #para {
            color: red;
        }

        /* Class Selector */
        .text {
            color: green;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Basic CSS Selectors</h1>

    <p id="para">This is ID Selector.</p>

    <p class="text">This is Class Selector.</p>

    <h2>Welcome to HTML and CSS</h2>

</body>
</html>
